<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pencarian Data Peserta JPKM</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    /* CSS Tampilan tetap sama seperti sebelumnya */
    body { font-family: Arial, sans-serif; padding: 5px; text-align: center; }
    .container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    img.logo { width: 120px; margin-bottom: 15px; }
    h2 { margin-top: 0; }
    form { display: flex; flex-direction: column; align-items: center; max-width: 400px; margin: 0 auto 30px; }
    
    .form-group { width: 100%; margin-bottom: 15px; text-align: left; position: relative; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; height: 38px; font-size: 14px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }

    /* Autocomplete */
    .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-top: none; max-height: 200px; overflow-y: auto; z-index: 99; background-color: white; list-style: none; padding-left: 0; width: 100%; margin-top: 0; }
    .autocomplete-items li { padding: 10px; cursor: pointer; }
    .autocomplete-items li:hover { background-color: #e9e9e9; }

    /* Pesan Loading & Error */
    #loading, #not-found { margin-top: 20px; font-style: italic; }
    #not-found { color: red; }

    /* Kontainer Kartu */
    .kartu-container { position: relative; display: inline-block; margin-top: 30px; width: 100%; max-width: 500px; text-align: left; }
    .kartu-gambar { width: 100%; max-width: 500px; height: auto; }
    .text-field { position: absolute; font-size: 14px; font-weight: bold; color: black; }

    /* --- PENGATURAN POSISI TEKS (Sesuai kode asli Anda) --- */
    /* Paket SISWA */
    .kartu-siswa .nama { top: 110px; left: 52px; }
    .kartu-siswa .nojpkm { top: 130px; left: 52px; }
    .kartu-siswa .namagrup { top: 150px; left: 52px; }
    .kartu-siswa .ppkbasis { top: 168px; left: 150px; }
    .kartu-siswa .tgllahir { top: 152px; right: 58px; }
    .kartu-siswa .klinik { top: 187px; left: 150px; }
    .kartu-siswa .plafon { top: 205px; left: 150px; }
    .kartu-siswa .gigi { top: 218px; left: 150px; }
    .kartu-siswa .masaberlaku { top: 235px; left: 150px; }
    .kartu-siswa .namapaket { top: 258px; left: 50%; transform: translateX(-50%); text-align: center; }

    /* Paket SISWA SANTO ALOYSIUS */
    .kartu-aloysius .nama { top: 110px; left: 52px; }
    .kartu-aloysius .nojpkm { top: 130px; left: 52px; }
    .kartu-aloysius .namagrup { top: 150px; left: 52px; }
    .kartu-aloysius .tgllahir { top: 152px; right: 40px; }
    .kartu-aloysius .masaberlaku { top: 235px; left: 150px; }
    .kartu-aloysius .ppkbasis, .kartu-aloysius .klinik, .kartu-aloysius .plafon, .kartu-aloysius .gigi, .kartu-aloysius .namapaket { display: none !important; }

    /* Posisi Umum (Dasar Plus, Primer, dll) */
    .kartu-dasarplus .nama, .kartu-primer .nama, .kartu-mix .nama, .kartu-advanced .nama, .kartu-executive .nama, .kartu-platinum .nama { top: 115px; left: 52px; }
    .kartu-dasarplus .nojpkm, .kartu-primer .nojpkm, .kartu-mix .nojpkm, .kartu-advanced .nojpkm, .kartu-executive .nojpkm, .kartu-platinum .nojpkm { top: 132px; left: 52px; }
    .kartu-dasarplus .namagrup, .kartu-primer .namagrup, .kartu-mix .namagrup, .kartu-advanced .namagrup, .kartu-executive .namagrup, .kartu-platinum .namagrup { top: 150px; left: 52px; }
    .kartu-dasarplus .ppkbasis, .kartu-primer .ppkbasis, .kartu-mix .ppkbasis, .kartu-advanced .ppkbasis, .kartu-executive .ppkbasis, .kartu-platinum .ppkbasis { top: 168px; left: 150px; }
    .kartu-dasarplus .tgllahir, .kartu-primer .tgllahir, .kartu-mix .tgllahir, .kartu-advanced .tgllahir, .kartu-executive .tgllahir, .kartu-platinum .tgllahir { top: 236px; left: 150px; }
    .kartu-dasarplus .klinik, .kartu-primer .klinik, .kartu-mix .klinik, .kartu-advanced .klinik, .kartu-executive .klinik, .kartu-platinum .klinik { top: 187px; left: 150px; }
    .kartu-dasarplus .plafon, .kartu-primer .plafon, .kartu-mix .plafon, .kartu-advanced .plafon, .kartu-executive .plafon, .kartu-platinum .plafon { top: 205px; left: 150px; }
    .kartu-dasarplus .gigi, .kartu-primer .gigi, .kartu-mix .gigi, .kartu-advanced .gigi, .kartu-executive .gigi, .kartu-platinum .gigi { top: 218px; left: 150px; }
    .kartu-dasarplus .masaberlaku, .kartu-primer .masaberlaku, .kartu-mix .masaberlaku, .kartu-advanced .masaberlaku, .kartu-executive .masaberlaku, .kartu-platinum .masaberlaku { top: 247px; left: 318px; }

    /* Paket PLATINUM Color Override */
    .kartu-platinum * { color: #f5e188 !important; }

    /* Paket KEUSKUPAN */
    .kartu-keuskupan .nama { top: 100px; left: 52px; }
    .kartu-keuskupan .nojpkm { top: 120px; left: 52px; }
    .kartu-keuskupan .namagrup { top: 140px; left: 52px; }
    .kartu-keuskupan .ppkbasis { top: 168px; left: 150px; }
    .kartu-keuskupan .tgllahir { top: 236px; left: 150px; }
    .kartu-keuskupan .klinik { top: 187px; left: 150px; }
    .kartu-keuskupan .plafon { top: 205px; left: 150px; }
    .kartu-keuskupan .gigi { top: 218px; left: 150px; }
    .kartu-keuskupan .masaberlaku { top: 247px; left: 318px; }

    /* RESPONSIVE (HP) */
    @media only screen and (max-width: 600px) {
        /* Text Scaling */
        .text-field { font-size: 10px; }

        /* Siswa Mobile */
        .kartu-siswa .nama { top: 18%; left: 11%; }
        .kartu-siswa .nojpkm { top: 21%; left: 11%; }
        .kartu-siswa .namagrup { top: 24%; left: 11%; }
        .kartu-siswa .ppkbasis { top: 27.3%; left: 30%; }
        .kartu-siswa .tgllahir { top: 25%; right: 11%; }
        .kartu-siswa .klinik { top: 30%; left: 30%; }
        .kartu-siswa .plafon { top: 33%; left: 30%; }
        .kartu-siswa .gigi { top: 35.5%; left: 30%; }
        .kartu-siswa .masaberlaku { top: 38.5%; left: 26%; }
        .kartu-siswa .namapaket { top: 44%; font-size: calc(8px + 0.6vw); }

        /* Aloysius Mobile */
        .kartu-aloysius .nama { top: 18%; left: 11%; }
        .kartu-aloysius .nojpkm { top: 21%; left: 11%; }
        .kartu-aloysius .namagrup { top: 24%; left: 11%; }
        .kartu-aloysius .ppkbasis { top: 27.3%; left: 30%; }
        .kartu-aloysius .tgllahir { top: 25%; right: 8%; }
        .kartu-aloysius .klinik { top: 30%; left: 30%; }
        .kartu-aloysius .plafon { top: 33%; left: 30%; }
        .kartu-aloysius .gigi { top: 35.5%; left: 30%; }
        .kartu-aloysius .masaberlaku { top: 38.5%; left: 26%; }
        .kartu-aloysius .namapaket { top: 44%; font-size: calc(11px + 0.6vw); }
        
        /* Layout Umum Mobile (Dasar Plus, Primer, Mix, Advanced, Executive, Platinum, Keuskupan) */
        .kartu-dasarplus .nama, .kartu-mix .nama, .kartu-primer .nama, .kartu-advanced .nama, .kartu-executive .nama, .kartu-platinum .nama { top: 18.3%; left: 11%; }
        .kartu-dasarplus .nojpkm, .kartu-mix .nojpkm, .kartu-primer .nojpkm, .kartu-advanced .nojpkm, .kartu-executive .nojpkm, .kartu-platinum .nojpkm { top: 21%; left: 11%; }
        .kartu-dasarplus .namagrup, .kartu-mix .namagrup, .kartu-primer .namagrup, .kartu-advanced .namagrup, .kartu-executive .namagrup, .kartu-platinum .namagrup { top: 24%; left: 11%; }
        .kartu-dasarplus .ppkbasis, .kartu-mix .ppkbasis, .kartu-primer .ppkbasis, .kartu-advanced .ppkbasis, .kartu-executive .ppkbasis, .kartu-platinum .ppkbasis { top: 27.3%; left: 30%; }
        .kartu-dasarplus .tgllahir, .kartu-mix .tgllahir, .kartu-primer .tgllahir, .kartu-advanced .tgllahir, .kartu-executive .tgllahir, .kartu-platinum .tgllahir { top: 38%; left: 30%; }
        .kartu-dasarplus .klinik, .kartu-mix .klinik, .kartu-primer .klinik, .kartu-advanced .klinik, .kartu-executive .klinik, .kartu-platinum .klinik { top: 30%; left: 30%; }
        .kartu-dasarplus .plafon, .kartu-mix .plafon, .kartu-primer .plafon, .kartu-advanced .plafon, .kartu-executive .plafon, .kartu-platinum .plafon { top: 33%; left: 30%; }
        .kartu-dasarplus .gigi, .kartu-mix .gigi, .kartu-primer .gigi, .kartu-advanced .gigi, .kartu-executive .gigi, .kartu-platinum .gigi { top: 35.5%; left: 30%; }
        .kartu-dasarplus .masaberlaku, .kartu-mix .masaberlaku, .kartu-primer .masaberlaku, .kartu-advanced .masaberlaku, .kartu-executive .masaberlaku, .kartu-platinum .masaberlaku { top: 40.4%; left: 64%; font-size: calc(6.5px + 0.5vw); }
        .kartu-dasarplus .namapaket, .kartu-mix .namapaket, .kartu-primer .namapaket, .kartu-advanced .namapaket, .kartu-executive .namapaket, .kartu-platinum .namapaket { top: 210px; left: 50%; transform: translateX(-50%); text-align: center; }
        
        /* Khusus Keuskupan Mobile adjustment */
        .kartu-keuskupan .nama { top: 16%; left: 11%; }
        .kartu-keuskupan .nojpkm { top: 19%; left: 11%; }
        .kartu-keuskupan .namagrup { top: 22%; left: 11%; }
        .kartu-keuskupan .ppkbasis { top: 27.3%; left: 30%; }
        .kartu-keuskupan .tgllahir { top: 38%; left: 30%; }
        .kartu-keuskupan .klinik { top: 30%; left: 30%; }
        .kartu-keuskupan .plafon { top: 33%; left: 30%; }
        .kartu-keuskupan .gigi { top: 35.5%; left: 30%; }
        .kartu-keuskupan .masaberlaku { top: 40.4%; left: 64%; font-size: calc(6.5px + 0.5vw); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="JPKM LOGO.png" alt="Logo JPKM" class="logo" />
    <h2>Pencarian Data Peserta JPKM</h2>

    <form id="identity-form">
      <div class="form-group">
        <label for="name">Nama Peserta:</label>
        <input type="text" id="name" placeholder="Ketik nama peserta..." autocomplete="off" />
        <ul id="autocomplete-list" class="autocomplete-items"></ul>
      </div>
      <div class="form-group">
        <label for="package">Nama Paket:</label>
        <select id="package">
          <option value="">-- Pilih Paket --</option>
          <option value="SISWA">SISWA</option>
          <option value="SISWA SANTO ALOYSIUS">SISWA SANTO ALOYSIUS</option>
          <option value="PAKET MAHASISWA">PAKET MAHASISWA</option>
          <option value="UMUM">UMUM</option>
        </select>
      </div>
      <button type="submit">Cari</button>
    </form>

    <div id="loading" style="display: none;">Memuat data...</div>
    <div id="not-found" style="display: none;">Data tidak ditemukan. Silahkan periksa kembali input Anda atau chat wa admin di nomor 0811-2010-765</div>

    <div id="result" style="display: none;">
      <div class="kartu-container" id="kartu-container">
        <img id="kartu-gambar" class="kartu-gambar" />
        <div class="text-field nama" id="field-nama"></div>
        <div class="text-field nojpkm" id="field-nojpkm"></div>
        <div class="text-field namagrup" id="field-namagrup"></div>
        <div class="text-field ppkbasis" id="field-ppkbasis"></div>
        <div class="text-field tgllahir" id="field-tgllahir"></div>
        <div class="text-field klinik" id="field-klinik"></div>
        <div class="text-field plafon" id="field-plafon"></div>
        <div class="text-field gigi" id="field-gigi"></div>
        <div class="text-field masaberlaku" id="field-masaberlaku"></div>
        <div class="text-field namapaket" id="field-namapaket" style="display: none;"></div>
      </div>
    </div>
  </div> 

  <script src="script.js"></script>
</body>
</html>
